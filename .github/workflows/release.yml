name: Release

# Publication d'une version : pousser un tag annoté `vX.Y.Z` (son message = notes de version).
# Les builds signés attendent l'approbation manuelle de l'environnement « release »,
# seul endroit où la clé de signature des mises à jour est accessible.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="$(jq -r .version package.json)"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version ($VERSION)."
            exit 1
          fi
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          # Réutilise le brouillon d'un essai précédent du même tag, sinon le crée.
          # L'identifiant vient de la réponse de l'API (la liste des releases n'est pas immédiate).
          ID="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)"
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" \
              -f name="${TAG#v}" -F body=@notes.md > /dev/null
          else
            ID="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="${TAG#v}" -F body=@notes.md -F draft=true --jq .id)"
          fi
          if [ -z "$ID" ]; then
            echo "::error::Could not get the release id for $TAG."
            exit 1
          fi
          echo "Draft release $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    environment: release
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      # latest.json est assemblé par « publish » à partir des deux signatures (builds en parallèle).
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: --target ${{ matrix.target }} --bundles nsis
          uploadUpdaterJson: false

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ID: ${{ needs.create-release.outputs.id }}
    steps:
      - run: |
          TAG="$GITHUB_REF_NAME"
          API="repos/$GITHUB_REPOSITORY/releases/$ID"
          gh api "$API/assets" --paginate --jq '.[] | "\(.id) \(.name)"' > assets.txt
          cat assets.txt
          pick() { grep -E "$1" assets.txt | head -n 1; }
          X64="$(pick '_x64-setup\.exe$' | cut -d' ' -f2)"
          ARM="$(pick '_(arm64|aarch64)-setup\.exe$' | cut -d' ' -f2)"
          X64_SIG="$(pick '_x64-setup\.exe\.sig$' | cut -d' ' -f1)"
          ARM_SIG="$(pick '_(arm64|aarch64)-setup\.exe\.sig$' | cut -d' ' -f1)"
          if [ -z "$X64" ] || [ -z "$ARM" ] || [ -z "$X64_SIG" ] || [ -z "$ARM_SIG" ]; then
            echo "::error::Missing installers or signatures, not publishing."
            exit 1
          fi
          sig() { gh api "repos/$GITHUB_REPOSITORY/releases/assets/$1" -H "Accept: application/octet-stream"; }
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "$(gh api "$API" --jq .body)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg x64sig "$(sig "$X64_SIG")" --arg x64url "$BASE/$X64" \
            --arg armsig "$(sig "$ARM_SIG")" --arg armurl "$BASE/$ARM" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "windows-x86_64": {signature: $x64sig, url: $x64url},
              "windows-aarch64": {signature: $armsig, url: $armurl}}}' > latest.json
          cat latest.json
          # Rattache le brouillon à son tag (un tag déplacé le détache), puis envoie le manifeste.
          gh api -X PATCH "$API" -f tag_name="$TAG" > /dev/null
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          gh api -X PATCH "$API" -F draft=false -f make_latest=true --jq ".html_url"
